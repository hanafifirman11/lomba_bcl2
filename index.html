<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peserta Lomba 17 Agustusan 2024</title>
    <link rel="icon" href="./logo-bcl2.jpeg" type="image/png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.6.0/jspdf.umd.min.js"></script>
    <!-- PapaParse for CSV generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <!-- SheetJS (xlsx) for Excel generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- jsPDF AutoTable library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.16/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="fixed top-0 left-0 right-0 text-center py-4 bg-white z-10">
        <img src="./logo-bcl2.png" alt="Logo" class="mx-auto w-32 md:w-48" />
        <h1 class="text-xl md:text-2xl font-bold mt-2">Peserta Lomba 17 Agustusan 2024</h1>
    </header>
    <main class="max-w-6xl mx-auto p-4 pt-40 pb-20">
        <nav id="tabs" class="flex flex-wrap justify-center gap-2 md:gap-4 border-b mb-4">
            <button class="px-4 py-2 text-sm md:text-base border-b-2 border-blue-500 text-blue-600" data-target="anak5">Anak 5 Tahun Kebawah</button>
            <button class="px-4 py-2 text-sm md:text-base border-b-2 border-transparent" data-target="anak6-10">Anak 6-10 Tahun</button>
            <button class="px-4 py-2 text-sm md:text-base border-b-2 border-transparent" data-target="dewasa">Dewasa</button>
            <button class="px-4 py-2 text-sm md:text-base border-b-2 border-transparent" data-target="turnamen">Turnamen Group</button>
            <button class="px-4 py-2 text-sm md:text-base border-b-2 border-transparent" data-target="jadwal">Jadwal Lomba</button>
        </nav>

        <div id="content"></div>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 text-center py-4 text-sm text-gray-500 bg-white z-10">
        Powered by Firman Hanafi
    </footer>

    <script type="module" src="./main.js"></script>
</body>
</html>
