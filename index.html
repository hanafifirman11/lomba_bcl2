<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peserta Lomba 17 Agustusan 2024</title>
    <link rel="icon" href="./logo-bcl2.jpeg" type="image/png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.6.0/jspdf.umd.min.js"></script>
    <!-- PapaParse for CSV generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <!-- SheetJS (xlsx) for Excel generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- jsPDF AutoTable library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.16/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="text-center py-4">
        <img src="./logo-bcl2.png" alt="Logo" class="mx-auto w-32 md:w-48" />
        <h1 class="text-xl md:text-2xl font-bold mt-2">Peserta Lomba 17 Agustusan 2024</h1>
    </header>
    <main class="max-w-6xl mx-auto p-4">
        <nav id="tabs" class="flex flex-wrap justify-center gap-2 md:gap-4 border-b mb-4">
            <button class="px-4 py-2 text-sm md:text-base border-b-2 border-blue-500 text-blue-600" data-target="anak5">Anak 5 Tahun Kebawah</button>
            <button class="px-4 py-2 text-sm md:text-base border-b-2 border-transparent" data-target="anak6-10">Anak 6-10 Tahun</button>
            <button class="px-4 py-2 text-sm md:text-base border-b-2 border-transparent" data-target="dewasa">Dewasa</button>
            <button class="px-4 py-2 text-sm md:text-base border-b-2 border-transparent" data-target="turnamen">Turnamen Group</button>
            <button class="px-4 py-2 text-sm md:text-base border-b-2 border-transparent" data-target="jadwal">Jadwal Lomba</button>
        </nav>

        <section id="anak5" class="tab-content">
            <div class="mb-4">
                <label for="filterLomba" class="block mb-1 font-medium">Jenis Lomba</label>
                <select id="filterLomba" class="w-full md:w-1/3 border rounded p-2">
                    <option value="">Semua</option>
                    <option value="Lomba Mewarnai">Lomba Mewarnai</option>
                    <option value="Fashion Show">Fashion Show</option>
                    <option value="Sepeda Hias">Sepeda Hias</option>
                    <option value="Estafet Bola">Estafet Bola</option>
                    <option value="Estafet Bendera">Estafet Bendera</option>
                    <option value="Menyuapi Orang Tua Dengan Mata Tertutup">Menyuapi Orang Tua Dengan Mata Tertutup</option>
                </select>
            </div>
            <div class="flex flex-wrap gap-2 mb-4">
                <button id="printPDF" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded">Print PDF</button>
                <button id="exportCSV" class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-2 rounded">Export CSV</button>
                <button id="exportExcel" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded">Export Excel</button>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-2 text-left">No</th>
                            <th class="px-4 py-2 text-left">Nama</th>
                            <th class="px-4 py-2 text-left">Alamat</th>
                            <th class="px-4 py-2 text-left">RT</th>
                            <th class="px-4 py-2 text-left">Jenis Lomba</th>
                        </tr>
                    </thead>
                    <tbody id="tableAnak5" class="divide-y divide-gray-200 bg-white"></tbody>
                </table>
            </div>
        </section>

        <section id="anak6-10" class="tab-content hidden">
            <div class="mb-4">
                <label for="filterLomba10" class="block mb-1 font-medium">Jenis Lomba</label>
                <select id="filterLomba10" class="w-full md:w-1/3 border rounded p-2">
                    <option value="">Semua</option>
                    <option value="Balap Karung">Balap Karung</option>
                    <option value="Lomba Makan Kerupuk">Lomba Makan Kerupuk</option>
                    <option value="Balap Kelereng pakai masker">Balap Kelereng pakai masker</option>
                    <option value="Mengeluarkan bola dari dalam kardus">Mengeluarkan bola dari dalam kardus</option>
                    <option value="Memasukan pensil dalam botol">Memasukan pensil dalam botol</option>
                    <option value="Memecahkan Balon di kursi">Memecahkan Balon di kursi</option>
                    <option value="Fashion Show">Fashion Show</option>
                    <option value="Sepeda Hias">Sepeda Hias</option>
                </select>
            </div>
            <div class="flex flex-wrap gap-2 mb-4">
                <button id="printPDF10" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded">Print PDF</button>
                <button id="exportCSV10" class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-2 rounded">Export CSV</button>
                <button id="exportExcel10" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded">Export Excel</button>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-2 text-left">No</th>
                            <th class="px-4 py-2 text-left">Nama</th>
                            <th class="px-4 py-2 text-left">Alamat</th>
                            <th class="px-4 py-2 text-left">RT</th>
                            <th class="px-4 py-2 text-left">Jenis Lomba</th>
                        </tr>
                    </thead>
                    <tbody id="tableAnak6-10" class="divide-y divide-gray-200 bg-white"></tbody>
                </table>
            </div>
        </section>

        <section id="dewasa" class="tab-content hidden">
            <div class="mb-4">
                <label for="filterLombaDewasa" class="block mb-1 font-medium">Jenis Lomba</label>
                <select id="filterLombaDewasa" class="w-full md:w-1/3 border rounded p-2">
                    <option value="">Semua</option>
                    <option value="Tarik Tambang">Tarik Tambang</option>
                    <option value="Balap Bakiak">Balap Bakiak</option>
                    <option value="Memecahkan Balon Dengan Mata Tertutup">Memecahkan Balon Dengan Mata Tertutup</option>
                    <option value="Estafet Sarung">Estafet Sarung</option>
                    <option value="Estafet Kardus">Estafet Kardus</option>
                    <option value="Tenis Meja">Tenis Meja</option>
                    <option value="Mini Soccer memakai Sarung">Mini Soccer memakai Sarung</option>
                    <option value="Ambil Koin di pepaya di lumuri Coklat">Ambil Koin di pepaya di lumuri Coklat</option>
                    <option value="Menurunkan Karet di muka">Menurunkan Karet di muka</option>
                    <option value="Lempar  air dalam plastik">Lempar  air dalam plastik</option>
                    <option value="Gotong royong ember">Gotong royong ember</option>
                    <option value="Mengeluarkan bola dari dalam tepung">Mengeluarkan bola dari dalam tepung</option>
                    <option value="Playstation ( PES )">Playstation ( PES )</option>
                </select>
            </div>
            <div class="flex flex-wrap gap-2 mb-4">
                <button id="printPDFDewasa" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded">Print PDF</button>
                <button id="exportCSVDewasa" class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-2 rounded">Export CSV</button>
                <button id="exportExcelDewasa" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded">Export Excel</button>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-2 text-left">No</th>
                            <th class="px-4 py-2 text-left">Nama</th>
                            <th class="px-4 py-2 text-left">Alamat</th>
                            <th class="px-4 py-2 text-left">RT</th>
                            <th class="px-4 py-2 text-left">Jenis Lomba</th>
                        </tr>
                    </thead>
                    <tbody id="tableDewasa" class="divide-y divide-gray-200 bg-white"></tbody>
                </table>
            </div>
        </section>

        <section id="turnamen" class="tab-content hidden">
            <div class="space-y-8">
                <div class="tournament">
                    <h2 class="text-lg font-semibold text-center mb-2">Badminton Bapa-bapa</h2>
                    <iframe src="https://challonge.com/bcl2_badminton_bapa/module" class="w-full h-96 border-0" scrolling="auto" allowtransparency="true"></iframe>
                </div>
                <div class="tournament">
                    <h2 class="text-lg font-semibold text-center mb-2">Badminton Ibu-ibu</h2>
                    <iframe src="https://challonge.com/bcl2_badminton_ibuk/module" class="w-full h-96 border-0" scrolling="auto" allowtransparency="true"></iframe>
                </div>
                <div class="tournament">
                    <h2 class="text-lg font-semibold text-center mb-2">Tenis Meja</h2>
                    <iframe src="https://challonge.com/bcl2_tenis_meja/module" class="w-full h-96 border-0" scrolling="auto" allowtransparency="true"></iframe>
                </div>
                <div class="tournament">
                    <h2 class="text-lg font-semibold text-center mb-2">Mobile Legend</h2>
                    <iframe src="https://challonge.com/bcl_mobile_legend/module" class="w-full h-96 border-0" scrolling="auto" allowtransparency="true"></iframe>
                </div>
                <div class="tournament">
                    <h2 class="text-lg font-semibold text-center mb-2">Voli Bapa-bapa</h2>
                    <iframe src="https://challonge.com/bcl2_voli_bapa/module" class="w-full h-96 border-0" scrolling="auto" allowtransparency="true"></iframe>
                </div>
                <div class="tournament">
                    <h2 class="text-lg font-semibold text-center mb-2">Voli Ibu-ibu</h2>
                    <iframe src="https://challonge.com/bcl2_voli_ibu/module" class="w-full h-96 border-0" scrolling="auto" allowtransparency="true"></iframe>
                </div>
                <div class="tournament">
                    <h2 class="text-lg font-semibold text-center mb-2">Mini Soccer</h2>
                    <iframe src="https://challonge.com/bcl_minisoccer/module" class="w-full h-96 border-0" scrolling="auto" allowtransparency="true"></iframe>
                </div>
            </div>
        </section>

        <section id="jadwal" class="tab-content hidden">
            <div class="mb-4">
                <button id="printPDFJadwal" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded">Print PDF</button>
            </div>
            <img src="./jadwal-lomba.jpeg" alt="Jadwal Lomba" class="w-full h-auto" />
        </section>
    </main>

    <footer class="text-center py-4 text-sm text-gray-500">
        Powered by Firman Hanafi
    </footer>

    <script type="module" src="./main.js"></script>
</body>
</html>
